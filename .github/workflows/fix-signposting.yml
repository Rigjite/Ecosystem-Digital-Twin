name: fix-signposting (temporary)

on:
  push:
    branches: [release-v2.7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v2.7
      - name: Patch build_manifest.py signposting links
        run: |
          set -euxo pipefail
          f=scripts/build_manifest.py
          sed -i 's|{"relation": "describedby", "href": "ro-crate-metadata.json",|{"@id": "ro-crate-metadata.json", "relation": "describedby", "href": "ro-crate-metadata.json",|' "$f"
          sed -i 's|{"relation": "cite-as", "href": doi_url}|{"@id": doi_url, "relation": "cite-as", "href": doi_url}|' "$f"
          sed -i 's|{"relation": "license", "href": str(lic)}|{"@id": str(lic), "relation": "license", "href": str(lic)}|' "$f"
          sed -i 's|# no DOI or licence URL is ever invented here.|# no DOI or licence URL is ever invented here.\n    # Each entry also carries "@id" (= its href): JSON-LD link objects\n    # need one, and the rocrate library refuses crates without it.|' "$f"
          grep -n "signposting" "$f"
          test "$(grep -c -F '{"@id": "ro-crate-metadata.json", "relation": "describedby"' "$f")" = 1
          test "$(grep -c -F '{"@id": doi_url, "relation": "cite-as"' "$f")" = 1
          test "$(grep -c -F '{"@id": str(lic), "relation": "license"' "$f")" = 1
          test "$(grep -c -F '{"relation": "describedby"' "$f")" = 0
          test "$(grep -c -F '{"relation": "cite-as"' "$f")" = 0
          test "$(grep -c -F '{"relation": "license"' "$f")" = 0
          python3 -m py_compile "$f"
          git diff
      - name: Install validators
        run: python3 -m pip install --quiet pyyaml rocrate
      - name: Run full test suite on patched code
        run: python3 -m unittest discover -s tests -v
      - name: Commit the fix and remove this workflow
        run: |
          set -euxo pipefail
          git config user.name "Rigjite"
          git config user.email "124010624+Rigjite@users.noreply.github.com"
          git rm -q .github/workflows/fix-signposting.yml
          git add -A
          git status --short
          git commit -m "Fix RO-Crate signposting links: give each link an @id" -m "The rocrate library rejects JSON-LD link objects without @id, so ROCrate() raised ValueError on the generated crate and test_valid_crate failed in CI (226/227). Each signposting entry now carries @id equal to its href; relation, href and type are unchanged."
          git push origin release-v2.7
