name: unpack-v27
on:
  push:
    branches: [release-v2.7]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v2.7
      - name: Unpack v2.7 package and replace repo contents
        run: |
          set -euxo pipefail
          ls -la
          test -f ecosystem-digital-twin-v2.7-release.zip
          python3 -c "import zipfile; zipfile.ZipFile('ecosystem-digital-twin-v2.7-release.zip').extractall('/tmp/pkg')"
          find /tmp/pkg -type f | sort
          echo "PKG_COUNT=$(find /tmp/pkg/ecosystem-digital-twin -type f | wc -l)"
          test -f /tmp/pkg/ecosystem-digital-twin/SKILL.md
          test -f /tmp/pkg/ecosystem-digital-twin/CHANGELOG.md
          grep -q "2.7" /tmp/pkg/ecosystem-digital-twin/SKILL.md
          mkdir -p /tmp/keep
          cp -a .github /tmp/keep/github-backup
          cp -a LICENSE /tmp/keep/LICENSE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/pkg/ecosystem-digital-twin/. .
          rm -rf __MACOSX
          find . -name '.DS_Store' -delete
          if [ ! -f .github/workflows/tests.yml ]; then mkdir -p .github/workflows; cp /tmp/keep/github-backup/workflows/tests.yml .github/workflows/tests.yml; fi
          if [ ! -f LICENSE ]; then cp /tmp/keep/LICENSE LICENSE; fi
          rm -f ecosystem-digital-twin-v2.7-release.zip
          echo "NEW_COUNT=$(find . -type f ! -path './.git/*' | wc -l)"
          find . -type f ! -path './.git/*' | sort
          git status --short
          git config user.name "Rigjite"
          git config user.email "124010624+Rigjite@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Release v2.7"
          git push origin release-v2.7
